name: Eğitim defterleri sınaması

# Colab defterlerini sahte küçük veriyle (KB_SINAMA=1) baştan sona çalıştırır:
# veri hazırlama, eğitim, doğruluk ölçümü ve telefon modeline (TFLite) dönüştürme.
# Gerçek eğitim Colab'da yapılır; bu iş yalnız defterlerin bozulmadığını gösterir.
on:
  push:
    branches-ignore: [main]
    paths: ['egitim/**', '.github/workflows/egitim-sinama.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sina:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        defter: [kombinle_model_egitimi, kombinle_parca_egitimi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kurulum
        run: pip install --quiet 'tensorflow-cpu==2.19.*' scipy pillow numpy nbconvert ipykernel
      - name: Defteri çalıştır
        env:
          KB_SINAMA: '1'
          KB_CALISMA: ${{ runner.temp }}/kb
        run: |
          jupyter nbconvert --to notebook --execute --allow-errors --ExecutePreprocessor.timeout=2400 \
            --output-dir "$RUNNER_TEMP/cikti" "egitim/${{ matrix.defter }}.ipynb"
          # sonuçlar ve hatalar iş özetine (annotation) yazılır: günlük indirmeden görülebilsin
          python - "$RUNNER_TEMP/cikti/${{ matrix.defter }}.ipynb" <<'E'
          import json, re, sys
          nb = json.load(open(sys.argv[1]))
          hata = False
          for i, c in enumerate(nb['cells']):
              for o in c.get('outputs', []):
                  if o.get('output_type') == 'error':
                      hata = True
                      iz = [re.sub(r'\x1b\[[0-9;]*m', '', x) for x in o.get('traceback', [])]
                      metin = ' | '.join(l.strip() for l in '\n'.join(iz).splitlines() if l.strip())[-1500:]
                      print('::error title=Hücre %d::%s: %s ... %s' % (i, o.get('ename'), o.get('evalue', '')[:300], metin))
                  elif o.get('output_type') == 'stream':
                      for l in ''.join(o.get('text', '')).splitlines():
                          if re.search(r'doğru|IoU|boyutu|uyum|Modele giren|aynı türü|çıkış|bilgisi olan|atlandı|Çıkış', l):
                              print('::notice title=Hücre %d::%s' % (i, l.strip()[:300]))
          sys.exit(1 if hata else 0)
          E
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.defter }}
          path: |
            ${{ runner.temp }}/cikti
            ${{ runner.temp }}/kb/cikti
          retention-days: 7
