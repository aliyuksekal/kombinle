name: APK derle

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'magaza/**', 'egitim/**']
  workflow_dispatch:
    inputs:
      olc:
        description: 'Gerçek fotoğraflarla tanıma ölçümü yap'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: derle
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Yapay zekâ anahtarı yalnızca sunucuya gider; APK'ya yalnızca sunucu adresi ve
      # anahtardan tek yönlü türetilmiş uygulama imza anahtarı girer.
      - name: Kombinle sunucusunu kur
        id: sunucu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EPOSTA_GONDEREN: ${{ secrets.EPOSTA_GONDEREN }}
          REKLAM_IBAN: ${{ secrets.REKLAM_IBAN }}
          REKLAM_ALICI: ${{ secrets.REKLAM_ALICI }}
          REKLAM_FIYAT: ${{ secrets.REKLAM_FIYAT }}
          REKLAM_INDIRIM: ${{ secrets.REKLAM_INDIRIM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Sunucu gizli anahtarları yok; APK yapay zekâsız derlenecek."
            exit 0
          fi
          # kopyalarken gelen boşluk, satır sonu ya da tırnaklar anahtarı bozmasın
          GEMINI_API_KEY=$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"'"'")
          export GEMINI_API_KEY
          echo "::add-mask::$GEMINI_API_KEY"
          echo "Yapay zekâ anahtarı uzunluğu: ${#GEMINI_API_KEY} (başı: ${GEMINI_API_KEY:0:4}…)"
          UYGULAMA_ANAHTARI=$(printf '%s' "kombinle-uygulama:$GEMINI_API_KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$UYGULAMA_ANAHTARI"
          echo "UYGULAMA_ANAHTARI=$UYGULAMA_ANAHTARI" >> "$GITHUB_ENV"
          export UYGULAMA_ANAHTARI
          bash server/kur.sh 2>&1 | tee sunucu.log

      # Gerçek fotoğraflarla tanıma ölçümü: yalnız commit mesajında [olc] varsa (yapay zekâ maliyeti)
      - name: Kıyafet tanıma ölçümü
        if: contains(github.event.head_commit.message, '[olc]') || inputs.olc
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLC_CIKTI: /tmp/TANIMA.md
        run: |
          GEMINI_API_KEY=$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"'"'")
          export GEMINI_API_KEY
          node server/test/tanima-olc.mjs

      - name: APK derle (küçültülmüş, imzalı)
        env:
          SUNUCU_URL: ${{ steps.sunucu.outputs.url }}
          ADMOB_UYGULAMA: ${{ secrets.ADMOB_UYGULAMA_ID }}
          ADMOB_BIRIM: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -o pipefail
          ( cat sunucu.log 2>/dev/null; gradle assembleRelease --no-daemon --stacktrace \
              -PsunucuUrl="$SUNUCU_URL" -PuygulamaAnahtari="${UYGULAMA_ANAHTARI:-}" -PadmobUygulama="${ADMOB_UYGULAMA:-}" -PadmobBirim="${ADMOB_BIRIM:-}" 2>&1 ) | tee derleme.log
          echo "Sunucu: ${SUNUCU_URL:-yok}"

      - name: APK'yı hazırla
        run: |
          mkdir -p cikti
          cp app/build/outputs/apk/release/app-release.apk "cikti/Kombinle-1.0.${{ github.run_number }}.apk"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs cikti/*.apk | head -n 3
          ls -la cikti

      # Play Store için uygulama paketi (AAB). YUKLEME_ANAHTARI (base64 .p12) ve YUKLEME_SIFRE gizlileri
      # varsa onunla, yoksa deneme anahtarıyla imzalanır. APK her zaman deneme anahtarıyla kalır.
      - name: AAB derle (Play Store)
        env:
          SUNUCU_URL: ${{ steps.sunucu.outputs.url }}
          ADMOB_UYGULAMA: ${{ secrets.ADMOB_UYGULAMA_ID }}
          ADMOB_BIRIM: ${{ secrets.ADMOB_BANNER_ID }}
          YUKLEME_ANAHTARI: ${{ secrets.YUKLEME_ANAHTARI }}
          YUKLEME_SIFRE: ${{ secrets.YUKLEME_SIFRE }}
        run: |
          set -o pipefail
          EK=()
          if [ -n "$YUKLEME_ANAHTARI" ] && [ -n "$YUKLEME_SIFRE" ]; then
            printf '%s' "$YUKLEME_ANAHTARI" | base64 -d > "$RUNNER_TEMP/yukleme.p12"
            EK=(-PyuklemeDosyasi="$RUNNER_TEMP/yukleme.p12" -PyuklemeSifre="$YUKLEME_SIFRE")
            echo "AAB yükleme anahtarıyla imzalanıyor"
          else
            echo "Yükleme anahtarı yok: AAB deneme anahtarıyla imzalanıyor"
          fi
          gradle bundleRelease --no-daemon --stacktrace -PsunucuUrl="$SUNUCU_URL" -PuygulamaAnahtari="${UYGULAMA_ANAHTARI:-}" -PadmobUygulama="${ADMOB_UYGULAMA:-}" -PadmobBirim="${ADMOB_BIRIM:-}" "${EK[@]}" 2>&1 | tee -a derleme.log
          cp app/build/outputs/bundle/release/app-release.aab "cikti/Kombinle-1.0.${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/yukleme.p12"
          jarsigner -verify cikti/*.aab | tail -n 1
          ls -la cikti

      - uses: actions/upload-artifact@v4
        with:
          name: Kombinle-APK
          path: |
            cikti/*.apk
            cikti/*.aab

      - name: Sürüm sayfasına ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "deneme-${{ github.run_number }}" cikti/*.apk cikti/*.aab \
            --title "Kombinle deneme 1.0.${{ github.run_number }}" \
            --notes "Deneme sürümü. Telefona .apk kurulur; .aab Play Console'a yüklenecek pakettir." --prerelease

      - name: APK'yı 'apk' dalına koy
        run: |
          git config user.name "Kombinle Derleme"
          git config user.email "kombinle@users.noreply.github.com"
          cp cikti/*.apk /tmp/
          git checkout --orphan apk
          git rm -rf . -q
          rm -rf ./* .github 2>/dev/null || true
          cp /tmp/Kombinle-*.apk ./Kombinle.apk
          echo "1.0.${{ github.run_number }} $(git rev-parse --short ${{ github.sha }})" > SURUM.txt
          echo "sunucu: ${{ steps.sunucu.outputs.url || 'yok' }}" >> SURUM.txt
          [ -f /tmp/TANIMA.md ] && cp /tmp/TANIMA.md ./TANIMA.md
          git add Kombinle.apk SURUM.txt
          [ -f TANIMA.md ] && git add TANIMA.md
          git commit -q -m "APK 1.0.${{ github.run_number }}"
          git push -f origin apk

      - name: Hata günlüğünü kaydet
        if: failure()
        run: |
          git config user.name "Kombinle Derleme"
          git config user.email "kombinle@users.noreply.github.com"
          cat sunucu.log derleme.log > /tmp/derleme.log 2>/dev/null || true
          [ -s /tmp/derleme.log ] || echo "günlük yok" > /tmp/derleme.log
          git checkout --orphan gunluk
          git rm -rf . -q || true
          rm -rf ./* .github 2>/dev/null || true
          tail -n 400 /tmp/derleme.log > derleme.log
          git add derleme.log
          git commit -q -m "Derleme hatası ${{ github.run_number }}"
          git push -f origin gunluk
