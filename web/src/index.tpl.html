<!doctype html>
<html lang="tr" data-tema="acik">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8FAFC">
<title>Kombinle</title>
<script>{{BOOT}}</script>
<style>
{{FONTS}}
:root{
  --bg:#F7F5FD; --yuzey:#FFFFFF; --yuzey2:#EFEBFA; --murekkep:#1E1838; --soluk:#6F6890; --cizgi:#E3DDF3;
  --vurgu:#7446DE; --vurgu-ust:#FFFFFF; --vurgu-acik:#ECE4FD; --altin:#B9803F; --altin-acik:#F8EBDD;
  --iyi:#2F8F62; --uyari:#B4532A; --golge:0 1px 2px rgba(30,24,56,.06),0 8px 24px rgba(30,24,56,.08);
  --keten:radial-gradient(circle at 20% 15%,rgba(116,70,222,.09),transparent 55%),radial-gradient(circle at 85% 80%,rgba(233,154,107,.10),transparent 50%),#F1ECFB;
  --kart-kenar:#FFFFFF; --serif:'Lora',Georgia,serif; --sans:'Poppins',system-ui,sans-serif;
  --hava-zemin:linear-gradient(125deg,#5B34C9 0%,#9B4FC4 55%,#E2946A 100%);
  --r-buyuk:26px; --r-orta:18px; --r-kucuk:12px; --gecis:180ms cubic-bezier(.2,.7,.2,1);
}
html[data-tema="koyu"]{
  --bg:#0E0A24; --yuzey:#171236; --yuzey2:#211A47; --murekkep:#EEEAFB; --soluk:#A79FCB; --cizgi:#2E2659;
  --vurgu:#B596FF; --vurgu-ust:#1B1238; --vurgu-acik:#2C2160; --altin:#F0C48E; --altin-acik:#3A2E23;
  --iyi:#7FD1A8; --uyari:#F2A07C; --golge:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  --keten:radial-gradient(circle at 20% 15%,rgba(181,150,255,.12),transparent 55%),radial-gradient(circle at 85% 80%,rgba(240,196,142,.08),transparent 50%),#1D1640;
  --kart-kenar:#2A2253;
  --hava-zemin:linear-gradient(125deg,#3E2398 0%,#6E3592 55%,#A8604A 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--murekkep);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:10px}
.gizli{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ik{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ik.k{width:18px;height:18px}
#uygulama{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom));position:relative}
header.ust{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.marka{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.marka svg{width:26px;height:26px;color:var(--vurgu)}
.ikon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--murekkep);transition:background var(--gecis)}
.ikon-btn:active{background:var(--yuzey2)}
.pro-rozet{font-size:12px;font-weight:500;color:var(--altin);background:var(--altin-acik);padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
h1.baslik{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;margin:14px 0 4px;letter-spacing:-.01em}
h2.baslik{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;margin:0 0 4px}
.alt-yazi{color:var(--soluk);font-size:14px;margin:0}
.kart{background:var(--yuzey);border-radius:var(--r-buyuk);padding:18px;box-shadow:var(--golge);margin-top:14px}
/* Hava */
.hava{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.hava .derece{font-family:var(--serif);font-size:54px;line-height:1;font-weight:400;letter-spacing:-.03em;display:flex;align-items:flex-start;gap:6px}
.hava .derece svg{width:34px;height:34px;color:var(--vurgu);margin-top:4px;stroke-width:1.4}
.hava .yer{display:flex;align-items:center;gap:4px;font-weight:500;font-size:14px;min-width:0}
.hava .yer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hava .durum{color:var(--soluk);font-size:13.5px;line-height:1.45}
.hava .notlar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hava-alt{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.seg{display:inline-flex;background:var(--yuzey2);border-radius:99px;padding:3px}
.seg button{padding:6px 14px;border-radius:99px;font-size:13px;color:var(--soluk);transition:all var(--gecis)}
.seg button[aria-pressed="true"]{background:var(--yuzey);color:var(--murekkep);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500}
.kaynak{font-size:11px;color:var(--soluk)}
.etiket{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--yuzey2);color:var(--murekkep)}
.etiket.uyari{background:var(--vurgu-acik)}
.etiket svg{width:15px;height:15px}
/* İstek */
.istek-alan{position:relative;margin-top:10px}
textarea.istek{width:100%;min-height:76px;resize:none;border:1.5px solid var(--cizgi);background:var(--bg);border-radius:var(--r-orta);padding:14px 56px 14px 16px;font-size:15px;line-height:1.45;transition:border-color var(--gecis)}
textarea.istek:focus{outline:none;border-color:var(--vurgu)}
textarea.istek::placeholder{color:var(--soluk)}
.mik{position:absolute;right:8px;bottom:10px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--vurgu-acik);color:var(--vurgu)}
.mik.dinliyor{background:var(--vurgu);color:var(--vurgu-ust);animation:nabiz 1.2s ease-in-out infinite}
@keyframes nabiz{50%{box-shadow:0 0 0 8px rgba(116,70,222,.2)}}
.cipler{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;margin:0 -2px;scrollbar-width:none}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--cizgi);font-size:13.5px;white-space:nowrap;transition:all var(--gecis);background:transparent}
.cip[aria-pressed="true"]{border-color:var(--vurgu);background:var(--vurgu-acik);color:var(--murekkep)}
.cip .say{color:var(--soluk);margin-left:4px;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:99px;font-weight:500;font-size:15px;transition:transform var(--gecis),opacity var(--gecis),background var(--gecis)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ana{background:var(--vurgu);color:var(--vurgu-ust)}
.btn.ikincil{background:var(--yuzey2);color:var(--murekkep)}
.btn.cizgili{border:1.5px solid var(--cizgi)}
.btn.altin{background:var(--altin);color:#fff}
html[data-tema="koyu"] .btn.altin{color:#2A1F12}
.btn.tam{width:100%}
.btn.kucuk{min-height:40px;padding:0 16px;font-size:14px}
.btn.tehlike{color:var(--uyari)}
.hak{text-align:center;font-size:13px;color:var(--soluk);margin:10px 0 0}
.hak b{color:var(--murekkep);font-weight:500}
/* Sonuç: stilist masası */
.masa-kart{margin-top:18px}
.masa-ust{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.masa-ust .no{font-size:13px;color:var(--soluk)}
.masa{position:relative;background:var(--keten);border-radius:var(--r-buyuk);padding:18px 14px 22px;margin-top:10px;display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:start;overflow:hidden}
.masa .sutun{display:flex;flex-direction:column;gap:12px}
.parca{position:relative;background:var(--kart-kenar);padding:6px;border-radius:14px;box-shadow:0 2px 4px rgba(46,31,43,.08),0 10px 22px rgba(46,31,43,.12);transform:rotate(var(--aci,0deg));transition:transform var(--gecis)}
.parca:active{transform:rotate(0deg) scale(1.02)}
.parca img,.parca .resimsiz{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:var(--yuzey2)}
.parca.uzun img,.parca.uzun .resimsiz{aspect-ratio:3/4}
.parca .ad{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);font-size:11.5px;background:rgba(255,255,255,.88);color:#2E1F2B;padding:2px 8px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parca.kesik img{object-fit:contain;padding:6%;background:var(--yuzey2)}
.oge.kesik img{object-fit:contain;padding:10%;background:var(--yuzey2)}
.oge.dinlen img{opacity:.45;filter:grayscale(.6)}
.cip.kucuk{padding:5px 12px;font-size:12.5px}
.cipler.sira{padding-top:6px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ikili label{display:block}
.araclar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.arac{background:var(--yuzey);border-radius:var(--r-orta);padding:14px;box-shadow:var(--golge);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.arac svg{color:var(--vurgu);width:26px;height:26px}
.arac b{font-weight:500;font-size:14.5px;line-height:1.3}
.arac small{color:var(--soluk);font-size:12px;line-height:1.35}
.arac .kilit{color:var(--altin)}
.takvim{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.takvim .gb{font-size:11.5px;color:var(--soluk);text-align:center;padding:4px 0}
.takvim .gun{aspect-ratio:1/1.25;border-radius:12px;background:var(--yuzey);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;gap:3px;font-size:12px;position:relative;overflow:hidden}
.takvim .gun.bos{background:transparent}
.takvim .gun.bugun{outline:2px solid var(--vurgu)}
.takvim .gun.gecmis{opacity:.75}
.takvim .gun img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:8px}
.takvim .gun.plan::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--altin)}
.takvim-ust{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.secim-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secim-izgara .oge[aria-pressed="true"]{outline:3px solid var(--vurgu);outline-offset:-3px}
.slot{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-orta);background:var(--yuzey2);width:100%;text-align:left;margin-top:8px}
.slot .kucuk-resim{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--yuzey);flex:none;display:grid;place-items:center;color:var(--soluk)}
.slot .kucuk-resim img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.cubuk{display:flex;height:16px;border-radius:99px;overflow:hidden;margin-top:8px}
.cubuk i{display:block;height:100%}
.istat-sayi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.istat-sayi div{background:var(--yuzey2);border-radius:var(--r-kucuk);padding:10px}
.istat-sayi b{display:block;font-family:var(--serif);font-size:22px;font-weight:500}
.istat-sayi small{color:var(--soluk);font-size:12px}
.liste-satir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cizgi)}
.liste-satir img,.liste-satir .bosr{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--yuzey2);flex:none}
.liste-satir span{flex:1;min-width:0;font-size:14px}
.liste-satir small{color:var(--soluk);font-size:12.5px;white-space:nowrap}
.bavul-gun{background:var(--yuzey2);border-radius:var(--r-orta);padding:12px;margin-top:10px}
.bavul-gun .ust{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px}
.mini-sira{display:flex;gap:6px;overflow-x:auto}
.mini-sira img,.mini-sira div{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:var(--yuzey)}
.isaret{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cizgi);width:100%;text-align:left}
.isaret .kutu{width:22px;height:22px;border-radius:7px;border:2px solid var(--cizgi);display:grid;place-items:center;flex:none}
.isaret[aria-checked="true"] .kutu{background:var(--vurgu);border-color:var(--vurgu);color:var(--vurgu-ust)}
.isaret[aria-checked="true"] span{text-decoration:line-through;color:var(--soluk)}
.ilham-izgara{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.ilham-izgara .oge{aspect-ratio:3/4}
.marka-logo{width:36px;height:36px;border-radius:11px;display:block;box-shadow:0 4px 12px rgba(40,20,110,.25)}
.marka-blok{display:flex;align-items:center;gap:10px}
.marka-blok .ad{font-family:var(--serif);font-style:italic;font-weight:600;font-size:23px;line-height:1}
.marka-blok small{display:block;font-size:11.5px;color:var(--vurgu);font-weight:500;margin-top:3px;letter-spacing:.01em}
.hak-hap{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--altin-acik);color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 30%,transparent)}
.kart.hava-kart{background:var(--hava-zemin);color:#fff}
.hava-kart .hava .derece svg{color:#FFE2B8}
.hava-kart .durum,.hava-kart .kaynak{color:rgba(255,255,255,.82)}
.hava-kart .etiket{background:rgba(255,255,255,.18);color:#fff}
.hava-kart .seg{background:rgba(255,255,255,.18)}
.hava-kart .seg button{color:rgba(255,255,255,.85)}
.hava-kart .seg button[aria-pressed="true"]{background:#fff;color:#2A1C5E}
.hava-kart .yer{color:#fff}
.hava-kart .cip{border-color:rgba(255,255,255,.4);color:#fff}
.hava-kart .cip[aria-pressed="true"]{background:#fff;color:#2A1C5E;border-color:#fff}
.hava-kart .bolum>.etk{color:rgba(255,255,255,.85)}
.hava-kart .btn.ikincil{background:rgba(255,255,255,.2);color:#fff}
.hava-kart .btn.ana{background:#fff;color:#2A1C5E}
.hava-kart h2.baslik,.hava-kart .alt-yazi{color:#fff}
.ortam-izgara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ortam-izgara .cip{text-align:center;border-radius:16px;padding:11px 8px;font-weight:500}
.ortam-izgara .cip[aria-pressed="true"]{background:var(--vurgu);color:var(--vurgu-ust);border-color:var(--vurgu)}
.tarz-sec{margin-top:14px}
.tarz-sec select{width:100%;height:48px;border:1.5px solid var(--cizgi);background:var(--bg);border-radius:16px;padding:0 14px;font-size:14px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soluk) 50%),linear-gradient(135deg,var(--soluk) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.tarz-sec select:focus{outline:none;border-color:var(--vurgu)}
.uyum{font-size:12px;font-weight:500;color:var(--iyi);background:color-mix(in srgb,var(--iyi) 12%,transparent);padding:5px 10px;border-radius:99px;white-space:nowrap}
.ipucu{margin-top:14px;padding:14px;border-radius:var(--r-orta);background:linear-gradient(120deg,var(--altin-acik),var(--vurgu-acik));border:1px solid color-mix(in srgb,var(--altin) 25%,transparent)}
.ipucu b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--altin)}
.ipucu p{margin:6px 0 0;font-size:14px;line-height:1.55}
.izgara.kartlar{grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:480px){.izgara.kartlar{grid-template-columns:repeat(3,1fr)}}
.giysi-kart{background:var(--yuzey);border-radius:22px;padding:8px;box-shadow:var(--golge);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.giysi-kart .foto{border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--yuzey2)}
.giysi-kart .foto img{width:100%;height:100%;object-fit:cover;display:block}
.giysi-kart.kesik .foto img{object-fit:contain;padding:10%}
.giysi-kart.dinlen .foto img{opacity:.45;filter:grayscale(.6)}
.giysi-kart b{font-weight:500;font-size:13.5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giysi-kart small{color:var(--soluk);font-size:12px;padding:0 4px 4px;display:flex;align-items:center;gap:6px}
.giysi-kart small i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.giysi-kart .ornek{position:absolute;top:14px;left:14px;font-size:10px;background:rgba(255,255,255,.92);color:#2A1C5E;padding:1px 7px;border-radius:99px}
.karsilama .logo-tam{width:min(78vw,320px);aspect-ratio:1;border-radius:34px;display:block;box-shadow:0 18px 50px rgba(40,20,110,.35)}
.kucuk-parcalar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kucuk-parcalar .parca{padding:4px;border-radius:11px}
.kucuk-parcalar .parca img,.kucuk-parcalar .parca .resimsiz{border-radius:7px}
.kucuk-parcalar .parca .ad{display:none}
.nedenler{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.nedenler li{display:flex;gap:10px;font-size:14px;line-height:1.5}
.nedenler li svg{color:var(--vurgu);margin-top:1px}
.anladim{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.eylemler{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:16px}
.eylemler .ikon-btn{width:50px;height:50px;background:var(--yuzey2)}
.eylemler .ikon-btn[aria-pressed="true"]{color:var(--vurgu)}
.eylemler .ikon-btn[aria-pressed="true"] svg{fill:currentColor}
/* Boş durum */
.bos{text-align:left;padding:22px}
.bos .resim{width:64px;height:64px;border-radius:20px;background:var(--vurgu-acik);color:var(--vurgu);display:grid;place-items:center;margin-bottom:12px}
.bos .resim svg{width:32px;height:32px}
.bos .dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* Dolap */
.dolap-ust{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.arama{display:flex;align-items:center;gap:8px;background:var(--yuzey);border:1.5px solid var(--cizgi);border-radius:99px;padding:0 14px;margin-top:14px;height:46px}
.arama input{border:0;background:transparent;flex:1;min-width:0;outline:none;font-size:14.5px}
.izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media (min-width:480px){.izgara{grid-template-columns:repeat(4,1fr)}}
.oge{position:relative;border-radius:16px;overflow:hidden;background:var(--yuzey2);aspect-ratio:3/4;box-shadow:var(--golge)}
.oge img{width:100%;height:100%;object-fit:cover;display:block}
.oge .alt{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(30,18,27,.72));color:#fff;font-size:11.5px;display:flex;align-items:center;gap:5px}
.oge .alt i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.7)}
.oge .alt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oge .ornek{position:absolute;top:6px;left:6px;font-size:10px;background:rgba(255,255,255,.9);color:#2E1F2B;padding:1px 7px;border-radius:99px}
.ekle-fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;height:54px;padding:0 20px 0 16px;border-radius:99px;background:var(--vurgu);color:var(--vurgu-ust);display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:0 8px 24px rgba(116,70,222,.35)}
/* Kombinlerim */
.gecmis{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.gecmis-oge{display:flex;gap:12px;align-items:center;background:var(--yuzey);border-radius:var(--r-orta);padding:10px;box-shadow:var(--golge);text-align:left;width:100%}
.mini-kolaj{display:grid;grid-template-columns:repeat(2,34px);grid-auto-rows:34px;gap:3px;flex:none}
.mini-kolaj img,.mini-kolaj div{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--yuzey2)}
.gecmis-oge .bilgi{min-width:0;flex:1}
.gecmis-oge .bilgi b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gecmis-oge .bilgi small{color:var(--soluk);font-size:12.5px}
/* Alt menü */
nav.alt-menu{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--yuzey) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--cizgi);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.alt-menu .ic{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.alt-menu button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--soluk)}
nav.alt-menu button[aria-current="page"]{color:var(--vurgu);font-weight:500}
nav.alt-menu button[aria-current="page"] svg{stroke-width:2}
/* Sayfa altı (bottom sheet) */
.perde{position:fixed;inset:0;z-index:20;background:rgba(25,12,22,.45);opacity:0;transition:opacity 220ms}
.perde.acik{opacity:1}
.sayfa{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:92vh;background:var(--yuzey);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 260ms cubic-bezier(.2,.8,.2,1)}
.sayfa.acik{transform:none}
.sayfa .tutamak{width:40px;height:4px;border-radius:9px;background:var(--cizgi);margin:10px auto 2px;flex:none}
.sayfa .bas{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 6px 20px;flex:none}
.sayfa .icerik{overflow-y:auto;padding:4px 20px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sayfa .alt-bar{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi);display:flex;gap:8px;flex:none}
.sayfa .alt-bar .btn{flex:1}
.bolum{margin-top:18px}
.bolum>.etk{font-size:13px;color:var(--soluk);margin:0 0 8px;display:block}
.sarili{display:flex;flex-wrap:wrap;gap:8px}
.renk-cip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:99px;border:1.5px solid var(--cizgi);font-size:13px}
.renk-cip i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.renk-cip[aria-pressed="true"]{border-color:var(--vurgu);background:var(--vurgu-acik)}
.buyuk-resim{width:100%;aspect-ratio:1;object-fit:contain;background:var(--yuzey2);border-radius:var(--r-orta);display:block}
.tahmin{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;background:var(--vurgu-acik);padding:10px 14px;border-radius:var(--r-kucuk)}
.tahmin svg{color:var(--vurgu)}
input.metin{width:100%;height:48px;border:1.5px solid var(--cizgi);background:var(--bg);border-radius:var(--r-kucuk);padding:0 14px;font-size:15px}
input.metin:focus{outline:none;border-color:var(--vurgu)}
.satir{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--cizgi);width:100%;text-align:left}
.satir:last-child{border-bottom:0}
.satir .sol{display:flex;align-items:center;gap:12px;min-width:0}
.satir .sol>div{min-width:0}
.satir small{display:block;color:var(--soluk);font-size:12.5px;line-height:1.4}
.anahtar{width:46px;height:28px;border-radius:99px;background:var(--cizgi);position:relative;flex:none;transition:background var(--gecis)}
.anahtar::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform var(--gecis)}
[aria-checked="true"] .anahtar{background:var(--vurgu)}
[aria-checked="true"] .anahtar::after{transform:translateX(18px)}
.ayar-grup{background:var(--yuzey2);border-radius:var(--r-orta);padding:0 14px;margin-top:8px}
.kamera{position:relative;background:#000;border-radius:var(--r-orta);overflow:hidden;aspect-ratio:3/4}
.kamera video{width:100%;height:100%;object-fit:cover;display:block}
.kamera .cerceve{position:absolute;inset:10%;border:2px dashed rgba(255,255,255,.55);border-radius:20px;pointer-events:none}
.deklansor{width:72px;height:72px;border-radius:50%;border:4px solid var(--vurgu);background:var(--yuzey);margin:14px auto 0;display:block}
.liste-ara{position:sticky;top:0;background:var(--yuzey);padding-bottom:8px;z-index:1}
.sehir{padding:12px 4px;border-bottom:1px solid var(--cizgi);width:100%;text-align:left;font-size:15px}
.pro-ozellik{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.pro-ozellik svg{color:var(--altin)}
.pro-fiyat{font-family:var(--serif);font-size:32px;margin:6px 0 0}
.yazi-blok{font-size:14px;line-height:1.65;color:var(--murekkep)}
.yazi-blok h3{font-family:var(--serif);font-weight:500;font-size:17px;margin:18px 0 4px}
.yazi-blok p{margin:0 0 8px}
/* Onay penceresi */
.pencere{position:fixed;left:50%;top:50%;z-index:31;width:min(360px,calc(100% - 40px));background:var(--yuzey);border-radius:24px;padding:22px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:all 200ms}
.pencere.acik{opacity:1;transform:translate(-50%,-50%)}
.pencere p{margin:6px 0 18px;color:var(--soluk);font-size:14.5px}
.pencere .dugmeler{display:flex;gap:8px}
.pencere .dugmeler .btn{flex:1;min-height:46px}
/* Bildirim */
.tost{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,20px);opacity:0;background:var(--murekkep);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:all 220ms;pointer-events:none}
.tost.acik{opacity:1;transform:translate(-50%,0)}
.yukleniyor{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:don .8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.iskelet{background:linear-gradient(90deg,var(--yuzey2),var(--cizgi),var(--yuzey2));background-size:200% 100%;animation:parilti 1.4s infinite;border-radius:10px}
@keyframes parilti{to{background-position:-200% 0}}
/* Karşılama */
.karsilama{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 4px calc(28px + env(safe-area-inset-bottom))}
.karsilama .vitrin{flex:1;display:grid;place-items:center;min-height:240px}
.karsilama .vitrin .masa{width:100%;max-width:340px;pointer-events:none}
.karsilama h1{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.1;margin:18px 0 10px;letter-spacing:-.015em}
.karsilama p{color:var(--soluk);margin:0 0 22px;font-size:15.5px}
.karsilama .btn+.btn{margin-top:10px}
.hata-ekrani{padding:40px 8px;text-align:left}

/* ====== Gemini Canvas tasarımı ====== */
:root{
  --bg:#F8FAFC; --yuzey:#FFFFFF; --yuzey2:#F1F5F9; --murekkep:#1E293B; --soluk:#64748B; --soluk2:#94A3B8; --cizgi:#E2E8F0; --cizgi2:#F1F5F9;
  --vurgu:#F43F5E; --vurgu-ust:#FFFFFF; --vurgu-acik:#FFF1F2; --koyu-btn:#0F172A; --altin:#B45309; --altin-acik:#FFFBEB; --altin-cizgi:#FDE68A;
  --iyi:#059669; --iyi-acik:#ECFDF5; --iyi-cizgi:#D1FAE5; --ust-zemin:rgba(255,255,255,.92); --serif:'Inter',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif;
  --golge:0 1px 2px rgba(15,23,42,.05); --keten:#F8FAFC; --kart-kenar:#FFFFFF;
  --ipucu-zemin:linear-gradient(90deg,#FFFBEB,#FFF1F2 55%,#FDF2F8); --ipucu-yazi:#451A03; --ipucu-baslik:#78350F;
  --girdi-zemin:#F8FAFC; --secim-zemin:#F8FAFC; --secim-yazi:#475569;
}
html[data-tema="koyu"]{
  --bg:#1E1F22; --yuzey:#141414; --yuzey2:#232428; --murekkep:#F1F5F9; --soluk:#9CA3AF; --soluk2:#7C828D; --cizgi:#2E3035; --cizgi2:#26272B;
  --vurgu:#E35068; --vurgu-ust:#FFFFFF; --vurgu-acik:#3A1C24; --koyu-btn:#121A2E; --altin:#F0B44C; --altin-acik:#1F1A10; --altin-cizgi:#4A3A1C;
  --iyi:#34D399; --iyi-acik:#0F2A20; --iyi-cizgi:#1E4B3A; --ust-zemin:rgba(19,19,19,.94);
  --golge:0 1px 2px rgba(0,0,0,.4); --keten:#1A1B1E; --kart-kenar:#232428;
  --ipucu-zemin:linear-gradient(90deg,#2A2112,#2E1A22 55%,#2C1928); --ipucu-yazi:#F5E6D3; --ipucu-baslik:#F0B44C;
  --girdi-zemin:#1E1F22; --secim-zemin:#1E1F22; --secim-yazi:#C9CDD6;
}
body{font-family:var(--sans);background:var(--bg)}
#uygulama{max-width:448px;padding:0 0 calc(92px + env(safe-area-inset-bottom));background:var(--bg);border-left:1px solid var(--cizgi);border-right:1px solid var(--cizgi)}
h1.baslik,h2.baslik,.yazi-blok h3{font-family:var(--sans);font-weight:800;letter-spacing:-.01em}
h1.baslik{font-size:22px;font-weight:900} h2.baslik{font-size:17px}
.g-bolum{padding:16px;display:flex;flex-direction:column;gap:16px}
.g-ust{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--ust-zemin);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--cizgi2)}
.g-marka{display:flex;align-items:center;gap:10px;min-width:0}
.g-logo{width:38px;height:38px;border-radius:14px;box-shadow:0 4px 10px rgba(244,63,94,.25)}
.g-marka h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--murekkep)}
.g-marka span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--vurgu);margin-top:3px}
.g-ust-sag{display:flex;align-items:center;gap:2px}
.g-jeton{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--altin-acik);color:var(--altin);border:1px solid var(--altin-cizgi);font-size:12.5px;font-weight:700}
svg.ik.dolu{fill:#F59E0B;stroke:#F59E0B}
svg.ik.vurgu{color:var(--vurgu)}
.g-hava{background:linear-gradient(90deg,#F43F5E,#EC4899 50%,#F59E0B);color:#fff;border-radius:26px;padding:20px;box-shadow:0 12px 26px -10px rgba(244,63,94,.45);display:flex;flex-direction:column;gap:12px}
.g-hava-ust{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.g-hava-pill{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px}
.g-hava h3{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:10px 0 2px;line-height:1.15}
.g-hava p,.g-hava-yer{font-size:12.5px;color:#FFE4E6;font-weight:500;margin:0;text-align:left}
.g-hava-ikon{background:rgba(255,255,255,.2);border-radius:18px;padding:12px;flex:none}
.g-hava-ikon svg{width:34px;height:34px;color:#FDE68A}
.g-hava-alt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#FFE4E6}
.g-gun{display:inline-flex;background:rgba(255,255,255,.2);border-radius:99px;padding:3px}
.g-gun button{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.g-gun button[aria-pressed="true"]{background:#fff;color:#BE123C}
.g-kaynak{font-size:10.5px;color:rgba(255,255,255,.75)}
.g-hava-link{font-size:12px;font-weight:600;color:#fff;text-decoration:underline}
.g-hava-dugme{display:flex;gap:8px;flex-wrap:wrap}
.g-hava-dugme button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:14px}
.g-hava-dugme button:first-child{background:#fff;color:#BE123C}
.g-hava .bolum{margin-top:0}
.g-hava .bolum>.etk{color:rgba(255,255,255,.85)}
.g-hava .cip{border-color:rgba(255,255,255,.45);color:#fff}
.g-hava .cip[aria-pressed="true"]{background:#fff;color:#BE123C;border-color:#fff}
.g-kart{background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:26px;padding:16px;box-shadow:var(--golge)}
.g-kart-bas{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-kart-bas h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0;color:var(--murekkep)}
.g-rozet{font-size:10.5px;font-weight:700;background:var(--yuzey2);color:var(--soluk);padding:3px 8px;border-radius:7px;white-space:nowrap}
.g-ortam{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.g-ortam button{padding:11px 10px;font-size:13px;font-weight:700;border-radius:16px;border:1px solid var(--cizgi);background:var(--secim-zemin);color:var(--secim-yazi);transition:all var(--gecis)}
.g-ortam button[aria-pressed="true"]{background:var(--vurgu);border-color:var(--vurgu);color:#fff;box-shadow:0 2px 6px rgba(244,63,94,.25)}
.g-diger{padding-top:10px}
.g-diger .cip[aria-pressed="true"]{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.g-etiket{display:block;font-size:12.5px;font-weight:700;color:var(--soluk);margin:14px 0 6px}
.g-kart select,#tarzSec,.g-girdi,.g-sira{width:100%;height:46px;background:var(--girdi-zemin);border:1px solid var(--cizgi);border-radius:16px;padding:0 14px;font-size:13.5px;font-weight:600;color:var(--murekkep);appearance:none;-webkit-appearance:none}
#tarzSec,.g-sira,select.g-girdi{background-image:linear-gradient(45deg,transparent 50%,var(--soluk2) 50%),linear-gradient(135deg,var(--soluk2) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.g-kart select:focus,.g-girdi:focus{outline:none;border-color:var(--vurgu)}
.g-girdi-kap{position:relative}
.g-girdi-kap .g-girdi{padding-right:52px}
.g-girdi-kap .mik{position:absolute;right:5px;top:5px;bottom:auto;width:36px;height:36px}
.g-olustur{width:100%;margin-top:16px;background:var(--koyu-btn);color:#fff;padding:15px;border-radius:16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px -8px rgba(15,23,42,.5)}
.g-olustur:active{transform:scale(.99)} .g-olustur[disabled]{opacity:.7}
.g-olustur svg.vurgu{color:#FB7185}
.g-sonuc{display:flex;flex-direction:column;gap:14px}
.g-sonuc-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--cizgi2);padding-bottom:10px}
.g-sonuc-bas h4{margin:0;font-size:15px;font-weight:800}
.g-sonuc-bas p{margin:2px 0 0;font-size:11.5px;color:var(--soluk2);font-weight:500}
.g-uyum{font-size:11.5px;font-weight:700;color:var(--iyi);background:var(--iyi-acik);border:1px solid var(--iyi-cizgi);padding:4px 10px;border-radius:99px;white-space:nowrap}
.g-ipucu{background:var(--ipucu-zemin);border:1px solid var(--altin-cizgi);border-radius:18px;padding:14px}
.g-ipucu div{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ipucu-baslik)}
.g-ipucu div svg{color:#D97706}
.g-ipucu p{margin:6px 0 0;font-size:13px;font-weight:500;line-height:1.55;color:var(--ipucu-yazi)}
.g-parcalar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-parca{background:var(--secim-zemin);border:1px solid var(--cizgi2);border-radius:16px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.g-parca img,.g-parca .resimsiz{width:100%;height:82px;object-fit:cover;border-radius:11px;background:var(--yuzey2)}
.g-parca.kesik img{object-fit:contain;padding:6%}
.g-parca b{font-size:11px;font-weight:700;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-parca span{font-size:10px;color:var(--soluk2);font-weight:500}
.g-neden summary{font-size:12.5px;font-weight:700;color:var(--soluk);cursor:pointer;list-style:none}
.g-neden summary::before{content:"＋ "}
.g-neden[open] summary::before{content:"－ "}
.g-neden .nedenler{margin-top:8px}
.g-eylem{display:flex;gap:8px}
.g-btn-ana{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--vurgu);color:#fff;font-weight:700;font-size:13.5px;padding:12px;border-radius:16px}
.g-btn-ana[disabled]{opacity:.6}
.g-btn-ikon{width:46px;height:46px;border-radius:16px;background:var(--yuzey2);display:grid;place-items:center;color:var(--murekkep)}
.g-btn-ikon[aria-pressed="true"]{color:var(--vurgu)} .g-btn-ikon[aria-pressed="true"] svg{fill:currentColor}
.g-baslik2{font-size:15px;font-weight:800;margin:6px 2px 0}
.g-araclar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.g-arac{background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:var(--golge)}
.g-arac-ikon{width:36px;height:36px;border-radius:12px;background:var(--vurgu-acik);color:var(--vurgu);display:grid;place-items:center}
.g-arac b{font-size:13.5px;font-weight:700;margin-top:4px} .g-arac small{font-size:11.5px;color:var(--soluk2);line-height:1.35}
.g-dolap-bas{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-dolap-bas h2{margin:0;font-size:17px;font-weight:900}
.g-dolap-bas p{margin:2px 0 0;font-size:12px;color:var(--soluk2);font-weight:500}
.g-ekle{display:inline-flex;align-items:center;gap:6px;background:var(--vurgu);color:#fff;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:16px;box-shadow:0 4px 12px rgba(244,63,94,.3);white-space:nowrap}
.g-haplar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.g-haplar::-webkit-scrollbar{display:none}
.g-haplar button{flex:none;padding:8px 14px;border-radius:16px;font-size:12.5px;font-weight:700;background:var(--yuzey);color:var(--secim-yazi);border:1px solid var(--cizgi);white-space:nowrap}
.g-haplar button[aria-pressed="true"]{background:var(--koyu-btn);color:#fff;border-color:var(--koyu-btn)}
html[data-tema="koyu"] .g-haplar button[aria-pressed="true"]{background:#F1F5F9;color:#0F172A;border-color:#F1F5F9}
.g-ara-satir{display:grid;grid-template-columns:1fr 132px;gap:8px}
.g-not{display:flex;align-items:center;gap:10px;font-size:12.5px;background:var(--vurgu-acik);padding:10px 12px;border-radius:14px;color:var(--murekkep)}
.g-not span{flex:1} .g-not button{font-weight:700;color:var(--vurgu);font-size:12.5px}
