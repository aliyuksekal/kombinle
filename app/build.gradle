plugins {
    id 'com.android.application'
}

def surumKodu = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// Kombinle sunucusu: GitHub Actions kurduktan sonra adresi ve uygulama anahtarını verir.
// Boşsa uygulama yapay zekâsız (cihaz içi) çalışır.
def sunucuAdresi = (project.findProperty('sunucuUrl') ?: '').toString().trim()
def uygulamaAnahtari = (project.findProperty('uygulamaAnahtari') ?: '').toString().trim()
if (!(sunucuAdresi ==~ /https:\/\/[a-z0-9.-]{3,120}/)) sunucuAdresi = ''
if (!(uygulamaAnahtari ==~ /[a-f0-9]{64}/)) uygulamaAnahtari = ''
// AdMob: gerçek kimlikler GitHub gizlilerinden gelir; yoksa Google'ın deneme kimlikleri ("Test Ad" yazan reklam)
def admobUygulama = (project.findProperty('admobUygulama') ?: '').toString().trim()
def admobBirim = (project.findProperty('admobBirim') ?: '').toString().trim()
if (!(admobUygulama ==~ /ca-app-pub-[0-9]{10,20}~[0-9]{6,12}/)) admobUygulama = 'ca-app-pub-3940256099942544~3347511713'
if (!(admobBirim ==~ /ca-app-pub-[0-9]{10,20}\/[0-9]{6,12}/)) admobBirim = 'ca-app-pub-3940256099942544/9214589741'
// Play Store yükleme anahtarı (isteğe bağlı): verilirse yalnız AAB derlemesinde kullanılır
def yuklemeDosyasi = (project.findProperty('yuklemeDosyasi') ?: '').toString().trim()
def yuklemeSifre = (project.findProperty('yuklemeSifre') ?: '').toString()
def yuklemeAlias = (project.findProperty('yuklemeAlias') ?: 'kombinle').toString()

android {
    namespace 'com.benim.kombinle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.benim.kombinle'
        minSdk 24
        targetSdk 35
        versionCode surumKodu
        versionName '1.0.' + surumKodu
        // Gerçek telefon işlemcileri; emülatör kütüphaneleri APK'yı gereksiz büyütüyor
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        buildConfigField 'String', 'SUNUCU', '"' + sunucuAdresi + '"'
        buildConfigField 'String', 'UYGULAMA_ANAHTARI', '"' + uygulamaAnahtari + '"'
        buildConfigField 'String', 'ADMOB_BIRIM', '"' + admobBirim + '"'
        manifestPlaceholders = [admobUygulama: admobUygulama]
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        // Test sürümleri için sabit anahtar: yeni APK eskisinin üstüne kurulur.
        // Play Store'a yüklenecek sürüm ayrı bir yükleme anahtarıyla imzalanmalı.
        deneme {
            storeFile rootProject.file('imza/deneme.p12')
            storeType 'PKCS12'
            storePassword 'kombinle-deneme'
            keyAlias 'kombinle'
            keyPassword 'kombinle-deneme'
        }
        if (yuklemeDosyasi) {
            yukleme {
                storeFile file(yuklemeDosyasi)
                storeType 'PKCS12'
                storePassword yuklemeSifre
                keyAlias yuklemeAlias
                keyPassword yuklemeSifre
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig yuklemeDosyasi ? signingConfigs.yukleme : signingConfigs.deneme
        }
        debug {
            signingConfig signingConfigs.deneme
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        // model sıkıştırılmadan paketlenir: daha hızlı yüklenir
        noCompress += ['tflite']
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:8.3.0'
    // Cihaz içinde çalışan görüntü etiketleme (model APK'nın içinde, internet gerekmez)
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    // Arka plan silme: konu ayırma (Google Play hizmetleri modeli telefona indirir)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    // Kombinle'nin kendi kıyafet tanıma modelini telefonda çalıştırır (LiteRT, 16 KB sayfa uyumlu)
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    // Uygulama kapalıyken yeni takipçi ve mesajları kontrol edip telefon bildirimi gösterir
    implementation 'androidx.work:work-runtime:2.9.1'
    // Kombinle kamerası: telefonun kamera donanımıyla dokunarak odak, yakınlaştırma, flaş
    def kameraSurum = '1.4.1'
    implementation "androidx.camera:camera-core:$kameraSurum"
    implementation "androidx.camera:camera-camera2:$kameraSurum"
    implementation "androidx.camera:camera-lifecycle:$kameraSurum"
    implementation "androidx.camera:camera-view:$kameraSurum"
    implementation 'androidx.activity:activity:1.9.3'
    // CameraX ListenableFuture döndürür (reklam SDK'sı boş "listenablefuture" sürümünü çekiyor); küçültmede kullanılmayanlar atılır
    implementation 'com.google.guava:guava:33.3.1-android'
    // Keşfet'te AdMob reklamı ve AB/BK için reklam izni formu
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
