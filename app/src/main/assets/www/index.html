.g-yorum div{flex:1;min-width:0;overflow-wrap:anywhere} .g-yorum b{color:var(--vurgu);font-weight:800;margin-right:6px}
.g-yorum small{display:block;color:var(--soluk2);font-size:10.5px;margin-top:2px}
.g-yorum .ikon-btn{width:28px;height:28px;flex:none}
.g-yorum-form{display:flex;gap:8px}
.g-yorum-form input{flex:1;min-width:0;border:1px solid var(--cizgi);border-radius:99px;padding:9px 14px;font:inherit;font-size:13px;background:var(--girdi-zemin);color:var(--murekkep)}
.g-yorum-form button{background:var(--grad);color:#fff;border-radius:99px;padding:9px 14px;font-size:12.5px;font-weight:800;flex:none}
.g-kisiler{background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:24px;padding:14px;box-shadow:var(--golge-p)}
.g-kisiler-bas{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.g-kisiler-bas b{font-size:14px;font-weight:900} .g-kisiler-bas small{font-size:11.5px;color:var(--soluk);font-weight:600}
.g-kisi-sira{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.g-kisi-sira::-webkit-scrollbar{display:none}
.g-kisi{flex:none;width:132px;background:var(--yuzey2);border:1px solid var(--cizgi2);border-radius:18px;padding:12px 10px;text-align:center}
.g-kisi .uav{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center;margin:0 auto 8px}
.g-kisi b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-kisi small{display:block;font-size:10.5px;color:var(--soluk);margin:3px 0 8px;font-weight:600}
.g-kisi .g-takip{background:var(--grad);color:#fff;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:800;width:100%}
.g-kisi .g-takip[aria-pressed="true"]{background:var(--yuzey);color:var(--vurgu);border:1px solid var(--vurgu)}
.g-kisi-ac{display:block;width:100%;background:none}
.g-gorunurluk{display:flex;gap:8px;flex-wrap:wrap}
/* ====== Kompakt ana sayfa ====== */
#uygulama > section:not([class]){padding:12px 14px}
.g-bolum{gap:12px;padding:12px 14px}
.g-hava{padding:13px 15px!important;gap:7px!important;border-radius:22px}
.g-hava h3{font-size:21px;margin:5px 0 0}
.g-hava-pill{font-size:10px;padding:3px 10px}
.g-hava-yer{font-size:12px}
.g-hava-ikon{padding:8px;border-radius:14px} .g-hava-ikon svg{width:24px;height:24px}
.g-hava-alt{font-size:11.5px}
.g-hava .seg button{padding:5px 12px;font-size:12px}
.g-kart{padding:14px;border-radius:22px}
.g-kart-bas h3{font-size:14.5px}
.g-ortam{gap:8px} .g-ortam button{padding:10px 8px;font-size:13px;border-radius:14px}
.g-diger button{padding:6px 11px;font-size:12px}
.g-olustur{padding:12px!important;border-radius:16px}
.kart.bos{padding:16px;border-radius:22px;text-align:left}
.kart.bos .resim{width:44px;height:44px;border-radius:14px;margin:0 0 10px}
.kart.bos .resim svg{width:22px;height:22px}
.kart.bos h2.baslik{font-size:15.5px;margin:0 0 4px}
.kart.bos .alt-yazi{font-size:12.5px;line-height:1.5;margin:0}
.kart.bos .dugmeler{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.kart.bos .dugmeler .btn{flex:1;min-width:130px;padding:10px 12px;font-size:13px}
.g-analiz-kart{padding:11px 12px;margin-top:8px;border-radius:18px;gap:10px}
.g-analiz-kart .g-arac-ikon{width:32px;height:32px}
.g-analiz-kart b{font-size:13px} .g-analiz-kart small{font-size:11px}
.g-araclar{gap:8px;margin-top:8px}
.g-arac{padding:10px 11px;border-radius:18px;gap:2px;flex-direction:row;align-items:center;flex-wrap:wrap}
.g-arac-ikon{width:30px;height:30px;border-radius:10px;margin-right:8px}
.g-arac b{font-size:12.5px;margin:0;flex:1;min-width:0}
.g-arac small{flex-basis:100%;font-size:10.5px;margin-top:4px}
.g-baslik2{font-size:14px}
/* Karosel: kombin parçaları (yukarı-aşağı) */
.karosel{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.karosel-ic{flex:1;min-width:0;height:184px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:184px;gap:0 8px!important;scrollbar-width:none}
.karosel-ic::-webkit-scrollbar{display:none}
.karosel-ic .g-parca{scroll-snap-align:start;height:176px;margin-bottom:8px}
.karosel-yan{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0}
.karosel-ok{width:32px;height:32px;border-radius:50%;background:var(--grad-soft);border:1px solid var(--cizgi);color:var(--vurgu);display:grid;place-items:center}
.karosel-ok:disabled{opacity:.35}
.karosel-ok svg.yukari{transform:rotate(-90deg)} .karosel-ok svg.asagi{transform:rotate(90deg)}
.karosel-nokta{display:flex;flex-direction:column;gap:5px}
.karosel-nokta i{width:6px;height:6px;border-radius:50%;background:var(--cizgi)}
.karosel-nokta i.acik{background:var(--vurgu);height:14px;border-radius:4px}
.karosel-sayi{font-size:10px;font-weight:800;color:var(--soluk)}
/* Keşfet akışı: dikey karosel */
html.akis-karosel{scroll-snap-type:y mandatory;scroll-padding-top:calc(72px + env(safe-area-inset-top))}
html.akis-karosel .g-akis,html.akis-karosel .g-kisiler,html.akis-karosel .g-bolum > .g-dolap-bas{scroll-snap-align:start}
html.akis-karosel .g-akis{min-height:calc(100dvh - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
html.akis-karosel .g-akis-resim{height:min(52vh,420px)}
.secki-bos{border:1.5px dashed var(--cizgi);border-radius:22px;background:var(--grad-soft);padding:30px 18px}
.secki-bos b{color:var(--murekkep);font-size:15px}
/* Ayarlar: açılır kapanır kartlar */
.ayar-kart{background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:20px;margin-bottom:10px;box-shadow:var(--golge-p);overflow:hidden}
.ayar-kart > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ayar-kart > summary::-webkit-details-marker{display:none}
.ayar-kart > summary div{flex:1;min-width:0}
.ayar-kart > summary b{display:block;font-size:14px;font-weight:800;color:var(--murekkep)}
.ayar-kart > summary small{display:block;font-size:11.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ayar-kart-ikon{width:36px;height:36px;border-radius:12px;background:var(--grad-soft);color:var(--vurgu);display:grid;place-items:center;flex:none}
.ayar-kart > summary svg.ok{transition:transform .25s ease;color:var(--soluk)}
.ayar-kart[open] > summary svg.ok{transform:rotate(90deg)}
.ayar-kart-ic{padding:0 14px 14px;animation:ayarAc .25s ease}
@keyframes ayarAc{from{opacity:0;transform:translateY(-4px)}}
.ayar-kart-ic .ayar-grup{border:1px solid var(--cizgi2);border-radius:16px;overflow:hidden}
.dil-izgara{grid-template-columns:repeat(2,1fr)!important}
.dil-rozet{background:var(--grad)!important;color:#fff;display:grid!important;place-items:center;font-size:13px;font-weight:900;font-style:normal}
/* Hesap */
.hesap-bolum{display:flex;flex-direction:column;gap:10px}
.hesap-alan{display:flex;flex-direction:column;gap:5px}
.hesap-alan span{font-size:10.5px;font-weight:800;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em}
.hesap-kart{display:flex;align-items:center;gap:12px;padding:12px;background:var(--grad-soft);border-radius:16px}
.hesap-kart.kucuk{padding:10px}
.hesap-kart b{display:block;font-size:14px;font-weight:800} .hesap-kart small{display:block;font-size:11.5px;color:var(--soluk);overflow:hidden;text-overflow:ellipsis}
.hesap-kart > div{min-width:0}
.hesap-av{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.hesap-kart.kucuk .hesap-av{width:36px;height:36px;font-size:15px}
.hesap-dugmeler{display:flex;gap:8px} .hesap-dugmeler .btn{flex:1}
.btn.tehlike-cizgi{background:transparent;border:1.5px solid #f43f5e;color:#f43f5e}
.hesap-link{background:none;color:var(--vurgu);font-weight:700;font-size:13px;padding:4px;align-self:center}
.kurtarma-kod{font:800 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;padding:16px;margin:12px 0;border-radius:16px;background:var(--grad-soft);border:1.5px dashed var(--vurgu);color:var(--murekkep);user-select:all}
.g-hesap{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-right:6px;background:var(--yuzey2);border:1px solid var(--cizgi);color:var(--murekkep);font-weight:900;font-size:14px}
.g-hesap.girisli{background:var(--grad);color:#fff;border-color:transparent}
/* Mağaza: aylık PRO */
.g-pro-fiyat small{font-size:12px;font-weight:700;opacity:.8;margin-left:2px}
.g-pro-kiyas{margin:6px 0 2px;font-size:12px;color:#FDE68A;font-weight:700}
.g-pro-not{margin:10px 0 0;font-size:10.5px;opacity:.7;line-height:1.45}
.g-pro-btn.ikincil{background:rgba(255,255,255,.14)!important;box-shadow:none}
/* Kombin kolajı ve paylaşım paneli */
.g-kolaj{display:block;width:100%;margin-top:12px;border-radius:20px;overflow:hidden;background:var(--grad-soft);border:1px solid var(--cizgi2);padding:0;aspect-ratio:4/5}
.g-kolaj img{width:100%;height:100%;object-fit:cover;display:block}
.g-kolaj.yukleniyor-kap{display:grid;place-items:center}
.g-parca-liste summary{margin-top:10px}
.g-paylas-panel{margin-top:14px;padding:14px;border-radius:18px;background:var(--grad-soft);border:1px solid var(--cizgi2);display:flex;flex-direction:column;gap:10px;animation:ayarAc .3s ease}
.g-paylas-bas{display:flex;align-items:center;gap:8px} .g-paylas-bas b{font-size:14px;font-weight:800}
.g-paylas-panel .etk{font-size:10.5px;font-weight:800;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em}
.g-paylas-panel .ayar-not{margin:0} .g-paylas-panel .cip{gap:6px} .g-paylas-panel .g-onay{font-size:12.5px;font-weight:600}
.g-paylasildi{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--vurgu)}
.g-kombin-sira{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:18px;background:var(--yuzey);border:1px solid var(--cizgi2);box-shadow:var(--golge-p)}
.g-kombin-sira div{flex:1;min-width:0} .g-kombin-sira b{display:block;font-size:13.5px;font-weight:800} .g-kombin-sira small{font-size:11.5px;color:var(--soluk)}
.g-kombin-sira .g-arac-ikon{margin:0}
.oto-rozet{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:10.5px;font-weight:700;color:var(--vurgu);text-transform:none;letter-spacing:0}
.oto-rozet svg{width:12px;height:12px}
.ad-girdi{font-weight:700}
/* Profil, kullanıcı adı, yönetici */
.kadi{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--vurgu);letter-spacing:0}
.kadi.bos{color:var(--soluk);font-weight:600}
.kadi.yan{margin-left:6px;font-size:11.5px;opacity:.9}
.resmi-rozet{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--vurgu);color:#fff}
.resmi-rozet svg{width:9px;height:9px;stroke-width:3.2}
.hesap-kart .kadi{display:flex;margin:1px 0}
.hesap-bio{margin:8px 2px 2px;font-size:13px;line-height:1.45;color:var(--metin2,var(--metin));white-space:pre-wrap;word-break:break-word}
.profil-duzenle-btn,.yonetici-btn{margin-top:10px}
.profil-duzen{display:flex;flex-direction:column;gap:12px}
.profil-ust{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--grad-soft);border:1px solid var(--cizgi2)}
.profil-ust b{display:block;font-size:16px;font-weight:800}
.hesap-av.buyuk{width:56px;height:56px;font-size:22px}
.kadi-kutu{display:flex;align-items:center;border:1px solid var(--cizgi2);border-radius:14px;background:var(--yuzey);padding-left:12px}
.kadi-kutu i{font-style:normal;font-weight:800;color:var(--vurgu)}
.kadi-kutu .metin{border:0!important;background:transparent!important;box-shadow:none!important;padding-left:4px}
.kadi-durum{display:block;margin-top:4px;font-size:11.5px;color:var(--soluk)}
.kadi-durum.iyi{color:#16a34a} .kadi-durum.kotu{color:#e11d48}
.hesap-alan .sayac{float:right;font-weight:600;color:var(--soluk)}
.hesap-alan.gizli{display:none}
.g-kisi-ac .kadi{display:flex;justify-content:center;font-size:11px}
/* Profil resmi */
.av-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.resimli{padding:0!important;overflow:hidden;background:var(--yuzey2)!important}
.g-logo-kap{position:relative;width:38px;height:38px;padding:0;border-radius:14px;flex:none;background:none}
.g-logo-kap .g-logo{width:38px;height:38px;display:block}
.g-logo-kap.kullanici .g-logo{border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--yuzey),0 0 0 4px var(--vurgu),0 6px 16px rgba(80,20,160,.3)}
.g-logo-arti{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--vurgu);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--yuzey);opacity:0;transform:scale(.6);transition:.2s}
.g-logo-kap:hover .g-logo-arti,.g-logo-kap:focus-visible .g-logo-arti{opacity:1;transform:none}
.g-logo-arti svg{width:11px;height:11px;stroke-width:3}
.hesap-av.dev{width:112px;height:112px;font-size:42px;margin:6px auto 4px;box-shadow:0 12px 30px -10px rgba(120,40,200,.55)}
.av-menu{display:flex;flex-direction:column;gap:6px}
.av-sar{position:relative;flex:none}
.av-kalem{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--vurgu);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--yuzey);pointer-events:none}
.av-kalem svg{width:12px;height:12px}
button.hesap-av{border:0;cursor:pointer}
.av-kirp-kap{display:flex;flex-direction:column;align-items:center;gap:14px}
.av-kirp-cerceve{position:relative;width:min(76vw,280px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:#111;touch-action:none}
.av-kirp{width:100%;height:100%;display:block;cursor:grab}
.av-kirp-cerceve::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 69.5%,rgba(0,0,0,.55) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.av-yakin-sar{display:flex;align-items:center;gap:10px;width:min(76vw,280px);color:var(--soluk)}
.av-yakin{flex:1;accent-color:var(--vurgu)}
/* Keşfet reklamları */
.g-reklam{transition:height .35s ease,opacity .3s ease,margin .35s ease;overflow:hidden}
.g-reklam.geciliyor{opacity:0;margin-top:-14px}
.g-reklam .rk-sponsor{font-weight:700;color:var(--soluk)}
.g-reklam .rk-av{background:var(--grad);color:#fff;border:0}
.g-reklam-gec{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:6px 10px 6px 12px;border-radius:99px;background:var(--yuzey2);border:1px solid var(--cizgi);font-size:11.5px;font-weight:800;color:var(--murekkep)}
.g-reklam-gec svg{width:12px;height:12px}
.g-reklam-gec:disabled{opacity:.6}
.g-reklam-medya{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--yuzey2);aspect-ratio:1}
.boyut-dikey .g-reklam-medya{aspect-ratio:4/5}
.boyut-hikaye .g-reklam-medya{aspect-ratio:9/16;max-height:72vh}
.boyut-yatay .g-reklam-medya{aspect-ratio:16/9}
.g-reklam-medya img{width:100%;height:100%;object-fit:cover;display:block}
.g-reklam-medya.ev{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:8px;padding:20px;text-align:left;color:#fff}
.g-reklam-medya.ev.r1{background:radial-gradient(120% 90% at 85% 10%,#f0abfc 0,rgba(240,171,252,0) 50%),linear-gradient(160deg,#7c3aed,#db2777)}
.g-reklam-medya.ev.r2{background:radial-gradient(120% 90% at 85% 10%,#a5f3fc 0,rgba(165,243,252,0) 50%),linear-gradient(160deg,#0f766e,#4338ca)}
.g-reklam-medya.ev.r3{background:radial-gradient(120% 90% at 85% 10%,#fde68a 0,rgba(253,230,138,0) 50%),linear-gradient(160deg,#ea580c,#be185d)}
.g-reklam-medya.ev.r4{background:radial-gradient(120% 90% at 85% 10%,#fbcfe8 0,rgba(251,207,232,0) 50%),linear-gradient(160deg,#1e1b4b,#7e22ce 60%,#db2777)}
.g-reklam-medya .rk-ikon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);margin-bottom:auto}
.g-reklam-medya .rk-ikon svg{width:30px;height:30px}
.boyut-yatay .g-reklam-medya .rk-ikon{width:44px;height:44px;border-radius:14px}
.g-reklam-medya .rk-baslik{font-size:clamp(19px,5.6vw,26px);line-height:1.15;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.boyut-yatay .g-reklam-medya .rk-baslik{font-size:18px}
.g-reklam-medya .rk-alt{font-size:13px;line-height:1.4;opacity:.9;max-width:34ch}
.boyut-yatay .g-reklam-medya .rk-alt{display:none}
.g-reklam-medya .rk-isik{position:absolute;inset:-30%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);animation:rkIsik 4.5s ease-in-out infinite;pointer-events:none}
@keyframes rkIsik{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.rk-ilerleme{position:absolute;left:12px;right:12px;top:10px;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.rk-ilerleme i{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.rk-ilerleme.akiyor i{transition:transform 5s linear;transform:scaleX(1)}
.g-reklam-cta{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;padding:11px 14px;border-radius:14px;background:var(--vurgu-acik);color:var(--vurgu);font-weight:800;font-size:13.5px;border:1px solid color-mix(in srgb,var(--vurgu) 20%,transparent)}
.g-reklam-cta svg{width:16px;height:16px}
.rk-yonetim-liste{display:flex;flex-direction:column;gap:10px}
.rk-satir{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--yuzey);border:1px solid var(--cizgi2)}
.rk-satir.pasif{opacity:.55}
.rk-satir img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--yuzey2)}
.rk-satir>div:nth-child(2){flex:1;min-width:0} .rk-satir b{display:block;font-size:13.5px} .rk-satir small{display:block;font-size:11.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-satir .rk-ist{color:var(--vurgu);font-weight:700}
.rk-dugmeler{display:flex;gap:4px}
.rk-resim-sec{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;aspect-ratio:1;border-radius:18px;border:2px dashed var(--cizgi);background:var(--yuzey2);color:var(--soluk);font-weight:700;overflow:hidden;padding:0;max-height:56vh}
.rk-resim-sec[data-boyut=dikey]{aspect-ratio:4/5} .rk-resim-sec[data-boyut=hikaye]{aspect-ratio:9/16} .rk-resim-sec[data-boyut=yatay]{aspect-ratio:16/9}
.rk-resim-sec img{width:100%;height:100%;object-fit:cover}
/* Sosyal: profil sayfası, bildirimler, kaydet, etiket */
.g-ust-ikili{display:inline-flex;align-items:center;gap:6px}
.g-zil{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--yuzey2);border:1px solid var(--cizgi);color:var(--murekkep)}
.g-zil svg{width:18px;height:18px}
.zil-rozet{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#e11d48;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--yuzey);animation:zilRozet .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes zilRozet{from{transform:scale(0)}}
.pr-sayfa{display:flex;flex-direction:column;gap:12px}
.pr-ust{display:flex;align-items:center;gap:16px}
.pr-av,.pr-av-btn .pr-av{width:84px;height:84px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900;flex:none;box-shadow:0 0 0 3px var(--yuzey),0 0 0 5px color-mix(in srgb,var(--vurgu) 55%,transparent)}
.pr-av-btn{padding:0;border-radius:50%;background:none;flex:none}
.pr-sayilar{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.pr-sayi{display:flex;flex-direction:column;align-items:center;background:none;padding:4px 0;border-radius:12px}
.pr-sayi b{font-size:18px;font-weight:900} .pr-sayi small{font-size:11.5px;color:var(--soluk)}
.pr-kim{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .pr-kim b{font-size:16px;font-weight:900}
.pr-bio{margin:-4px 0 0;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.pr-dugmeler{display:flex;gap:8px} .pr-dugmeler>*{flex:1}
.pr-dugmeler .ikon-kare{flex:0 0 46px;padding:0}
.g-takip.buyuk{border-radius:14px;padding:11px 14px;font-size:13px;background:var(--grad);color:#fff;font-weight:800}
.g-takip.buyuk[aria-pressed="true"]{background:var(--yuzey2);color:var(--murekkep);border:1px solid var(--cizgi)}
.pr-sekmeler{display:flex;border-bottom:1px solid var(--cizgi2);margin:0 -4px}
.pr-sekmeler button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:12.5px;font-weight:800;color:var(--soluk);background:none;border-bottom:2px solid transparent}
.pr-sekmeler button[aria-selected="true"]{color:var(--murekkep);border-bottom-color:var(--vurgu)}
.pr-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -4px}
.pr-tam{grid-column:1/-1}
.pr-hucre{position:relative;aspect-ratio:4/5;padding:0;overflow:hidden;background:var(--yuzey2);border-radius:6px}
.pr-hucre img{width:100%;height:100%;object-fit:cover;display:block}
.pr-hucre-bilgi{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:3px;padding:14px 6px 5px;font-size:10.5px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.pr-hucre-bilgi svg{width:11px;height:11px} .pr-hucre-bilgi svg:nth-of-type(2){margin-left:6px}
.pr-hucre-gor{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.pr-hucre-gor svg{width:11px;height:11px}
.pr-akis,.pr-detay{display:flex;flex-direction:column;gap:14px}
.tk-liste{display:flex;flex-direction:column;gap:4px}
.tk-satir{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px}
.tk-satir.yeni{background:var(--vurgu-acik)}
.tk-ac{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;padding:0}
.tk-ac .g-avatar{width:44px;height:44px;flex:none;font-size:16px}
.tk-ac>div{min-width:0} .tk-ac b{display:block;font-size:13.5px}
.tk-satir .g-takip{width:auto;flex:none}
.bn-metin{display:block;font-size:12px;color:var(--murekkep);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bn-metin i{font-style:normal;color:var(--soluk)}
.bn-resim{width:46px;height:46px;border-radius:10px;overflow:hidden;padding:0;flex:none;background:var(--yuzey2)}
.bn-resim img{width:100%;height:100%;object-fit:cover}
.g-akis-kim{background:none;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0}
.g-kaydet{margin-left:auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:none;color:var(--murekkep)}
.g-kaydet svg{width:20px;height:20px;transition:transform .2s}
.g-kaydet[aria-pressed="true"]{color:var(--vurgu)} .g-kaydet[aria-pressed="true"] svg{fill:currentColor;transform:scale(1.1)}
.etiket-link{background:none;padding:0;color:var(--vurgu);font-weight:700;font:inherit;font-weight:700;display:inline}
.g-akis-etiket .etiket-link{padding:3px 9px;border-radius:99px;background:var(--vurgu-acik);font-size:11.5px}
.kalp-patla{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;color:#fff;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));animation:kalpPatla .85s cubic-bezier(.2,1.4,.4,1) forwards}
.kalp-patla svg{width:100%;height:100%;fill:currentColor}
@keyframes kalpPatla{0%{transform:scale(0);opacity:0}25%{transform:scale(1.15);opacity:1}45%{transform:scale(.95)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.25) translateY(-20px);opacity:0}}
.cek-yenile{height:0;overflow:hidden;display:grid;place-items:center;color:var(--soluk);transition:height .2s,opacity .2s}
.cek-yenile.hazir{color:var(--vurgu)}
.cek-yenile svg{width:22px;height:22px}
.g-jeton{white-space:nowrap}
@media (max-width:420px){.g-marka span{display:none}.g-jeton{padding-left:10px;padding-right:10px}}
.pr-dugmeler .btn{white-space:nowrap;font-size:13px;padding-left:10px;padding-right:10px;min-width:0}
.tk-satir .g-takip,.g-takip.buyuk{background:var(--grad);color:#fff;border-radius:99px;padding:7px 14px;font-size:11.5px;font-weight:800;border:0}
.tk-satir .g-takip[aria-pressed="true"]{background:var(--yuzey2);color:var(--murekkep);border:1px solid var(--cizgi)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="acilis" aria-hidden="true">
<style>
/* Açılış: sade koyu zemin, yavaş akan aurora, cam karo içinde amblem, çizilen halka, ışık geçişi, kelime işareti, ilerleme çizgisi */
#acilis{position:fixed;inset:0;z-index:9999;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0c0720;
  transition:opacity .6s ease .1s,visibility .7s;contain:strict;--e:cubic-bezier(.22,1,.36,1)}
#acilis.bitti{opacity:0;visibility:hidden;pointer-events:none}
#acilis.bitti .orta{transform:scale(1.06);opacity:0;filter:blur(6px);transition:transform .6s var(--e),opacity .45s ease,filter .5s ease}
#acilis .au{position:absolute;border-radius:50%;filter:blur(60px);opacity:0;animation:akAuGir 1.6s ease forwards,akAuAk 14s ease-in-out infinite alternate;will-change:transform}
#acilis .au.a1{width:78vmax;height:78vmax;left:-30vmax;top:-34vmax;background:radial-gradient(circle,#6d28d9 0%,rgba(109,40,217,0) 65%)}
#acilis .au.a2{width:70vmax;height:70vmax;right:-32vmax;bottom:-30vmax;background:radial-gradient(circle,#db2777 0%,rgba(219,39,119,0) 62%);animation-delay:.15s,0s;animation-duration:1.6s,17s}
#acilis .au.a3{width:46vmax;height:46vmax;left:50%;top:44%;margin:-23vmax 0 0 -23vmax;background:radial-gradient(circle,rgba(167,139,250,.9) 0%,rgba(167,139,250,0) 60%);animation-delay:.35s,0s;animation-duration:1.8s,11s}
@keyframes akAuGir{to{opacity:.55}}
@keyframes akAuAk{to{transform:translate(6vmax,4vmax) scale(1.12)}}
#acilis .tane{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent .7px);background-size:3px 3px;mix-blend-mode:overlay}
#acilis .orta{position:relative;display:flex;flex-direction:column;align-items:center;width:min(74vw,320px)}
#acilis .kap{position:relative;width:46%;aspect-ratio:1}
#acilis .karo{position:relative;width:100%;aspect-ratio:1;border-radius:30%;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);
  box-shadow:0 30px 60px -20px rgba(80,20,160,.7),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(10px);
  animation:akKaro 1.1s .15s var(--e) both;overflow:hidden}
@keyframes akKaro{0%{opacity:0;transform:scale(.55) translateY(14px);filter:blur(10px)}60%{filter:blur(0)}100%{opacity:1;transform:none}}
#acilis .amblem{width:74%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(170,110,255,.5));animation:akAmb 1s .4s var(--e) both}
@keyframes akAmb{from{opacity:0;transform:scale(.8) rotate(-6deg)}}
#acilis .isik{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-110%);animation:akIsik 1.1s 1.15s ease-in-out both}
@keyframes akIsik{to{transform:translateX(110%)}}
#acilis svg.halka{position:absolute;inset:-9%;width:118%;height:118%;overflow:visible;pointer-events:none}
#acilis .halka rect{fill:none;stroke:url(#akHg);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:akHalka 1.4s .55s var(--e) forwards,akHalkaSon .8s 2s ease forwards}
@keyframes akHalka{to{stroke-dashoffset:0}}
@keyframes akHalkaSon{to{opacity:.25}}
#acilis .ad{width:78%;height:auto;margin-top:12%;display:block;animation:akAd 1s 1.05s var(--e) both}
@keyframes akAd{from{opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
#acilis .slogan{width:66%;height:auto;margin-top:5%;display:block;opacity:.85;animation:akSlg 1s 1.45s var(--e) both}
@keyframes akSlg{from{opacity:0;letter-spacing:.3em;transform:translateY(8px)}}
#acilis .alt{position:absolute;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(36vw,140px);height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;animation:akSlg .6s .5s ease both}
#acilis .alt i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#c084fc,#f472b6);animation:akYuk 2.3s .4s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes akYuk{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#acilis *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
